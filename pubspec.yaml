name: agrilink
description: "Agrilink Mobile - Final Year Project Flutter App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  lottie: ^3.3.1

  # Networking
  dio: ^5.4.0
  socket_io_client: ^2.0.0
  url_launcher: ^6.2.0
  share_plus: ^7.2.1
  connectivity_plus: ^6.0.0

  # Local Storage
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0

  # Dependency Injection
  get_it: ^7.6.7

  # State Management
  flutter_bloc: ^8.1.4
  equatable: ^2.0.5
  dartz: ^0.10.1

  # Navigation
  go_router: ^14.0.0

  # Logging
  logger: ^2.0.2

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  google_sign_in: ^6.3.0
  firebase_messaging: ^15.2.4

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Media
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1

  # WebView
  webview_flutter: ^4.5.0
  webview_flutter_android: ^3.12.0
  webview_flutter_wkwebview: ^3.9.0

  # Location & Permissions
  geolocator: ^12.0.0
  permission_handler: ^11.0.0

  # SMS
  sms_autofill: ^2.4.0
  file_picker: ^8.0.0
  flutter_markdown: ^0.7.0  

  # Speech-to-Text & Audio
  speech_to_text: ^7.3.0
  vibration: ^3.1.8
  audioplayers: ^6.6.0
  flutter_tts: ^3.8.5

  # Charts - ONLY COMPATIBLE VERSIONS
  fl_chart: ^0.68.0           # ✅ Compatible with intl ^0.20.2
  graphic: ^2.4.0             # ✅ Compatible with intl ^0.20.2
  percent_indicator: ^4.2.3   # ✅ No intl dependency

  # Security
  flutter_secure_storage: ^9.0.0

  # Date & Time
  timeago: ^3.6.0

  # Animations
  animations: ^2.0.11

  # Utilities
  clipboard: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

  # Testing
  integration_test:
    sdk: flutter
  mocktail: ^1.0.0
  mockito: ^5.4.4
  bloc_test: ^9.1.7

  # Code Generation
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  generate: true


flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#4CAF50"
  adaptive_icon_foreground: "assets/logo.png"